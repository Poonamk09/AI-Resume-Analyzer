<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="dashboard-container">

        <h1>Admin Dashboard</h1>

        <h3>Welcome, {{ session['admin_username'] }}!</h3>

        <div class="dashboard-cards">

            <div class="card">
                <h2>Total Users</h2>
                <h3>{{ total_users }}</h3>
            </div>

            <div class="card">
                <h2>Total Resumes</h2>
                <h3>{{ total_resumes }}</h3>
            </div>

            <div class="card">
                <h2>Total Jobs</h2>
                <h3>{{ total_jobs }}</h3>
            </div>

        </div>

        <br>

        <a href="/admin-users">
            <button type="button">View All Users</button>
        </a>

        <br><br>

        <a href="/admin-resumes">
            <button type="button">View All Resumes</button>
        </a>

        <br><br>

        <a href="/admin-logout">Logout</a>

    </div>

</body>
</html>
