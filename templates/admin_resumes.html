<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Resumes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="dashboard-container">

        <h1>Uploaded Resumes</h1>

        <table border="1" cellpadding="10" cellspacing="0">

            <tr>
                <th>Resume ID</th>
                <th>User Name</th>
                <th>Email</th>
                <th>File Name</th>
                <th>Uploaded Date</th>
            </tr>

            {% for resume in resumes %}

            <tr>
                <td>{{ resume.resume_id }}</td>
                <td>{{ resume.full_name }}</td>
                <td>{{ resume.email }}</td>
                <td>{{ resume.file_name }}</td>
                <td>{{ resume.uploaded_at }}</td>
            </tr>

            {% else %}

            <tr>
                <td colspan="5">No Resumes Uploaded Yet.</td>
            </tr>

            {% endfor %}

        </table>

        <br>

        <a href="/admin-dashboard">Back to Dashboard</a>

    </div>

</body>
</html>
