<!DOCTYPE html>
<html>
<head>
    <title>All Resumes</title>
</head>
<body>

<h2>Uploaded Resumes</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>Resume ID</th>
        <th>User Name</th>
        <th>Email</th>
        <th>File Name</th>
        <th>Uploaded Date</th>
    </tr>

    {% for resume in resumes %}
    <tr>
        <td>{{ resume[0] }}</td>
        <td>{{ resume[1] }}</td>
        <td>{{ resume[2] }}</td>
        <td>{{ resume[3] }}</td>
        <td>{{ resume[4] }}</td>
    </tr>
    {% endfor %}

</table>

<br>

<a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>

</body>
</html>
