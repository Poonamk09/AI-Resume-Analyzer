<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - AI Resume Analyzer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        /* Navbar */
        header {
            background: #243b55;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: white;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        /* Container */
        .container {
            width: 90%;
            max-width: 550px;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 25px;
        }

        /* Form Card */
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #243b55;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            background: #243b55;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn:hover {
            background: #141e30;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            color: #243b55;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            color: green;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            color: #666;
        }

    </style>
</head>

<body>

    <!-- Navbar -->
    <header>

        <h2>AI Resume Analyzer</h2>

        <nav>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>

    </header>

    <!-- Main Container -->
    <div class="container">

        <h1>Edit My Profile</h1>

        <div class="card">

            <!-- Edit Profile Form -->
            <form method="POST" action="{{ url_for('edit_profile') }}">

                <label for="full_name">Full Name</label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    value="{{ user.full_name }}"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user.email }}"
                    placeholder="Enter your email"
                    required
                >

                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value="{{ user.phone or '' }}"
                    placeholder="Enter your phone number"
                >

                <button type="submit" class="btn">
                    Save Changes
                </button>

                <a href="{{ url_for('profile') }}" class="back">
                    Cancel
                </a>

            </form>

        </div>

    </div>

    <!-- Footer -->
    <footer>
        © 2026 AI Resume Analyzer | All Rights Reserved
    </footer>

</body>
</html>
